name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  macos:
    # Compiles the Swift helper and packages the app on Apple Silicon.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:helper
      - name: Helper smoke test
        run: |
          echo '{"cmd":"status"}' | (cat; sleep 2) | ./native/build/arcadia-helper | head -3
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec electron-builder --mac --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Arcadia-mac-arm64
          path: dist/mac-arm64/Arcadia.app
          retention-days: 7
